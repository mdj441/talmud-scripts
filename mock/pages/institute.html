<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>פרטי מוסד - תלמו"ד (דמה)</title>
<script src="/mock/shim.js"></script>
<script src="/mock/db.js"></script>
<script src="/mock/common.js"></script>
</head>
<body>
<form id="aspnetForm" onsubmit="return false">
<div id="mock-root"></div>
</form>
<script>
(function () {
  'use strict';
  // דף המוסד (F1): התוכן (h1, "מספר סניף", גריד סוגי-הלימוד) הולך אחרי db.session.instituteId, *לא* אחרי הכתובת.
  // פירורי-הלחם מציגים את הסניף מה-InstituteID שבכתובת (ולכן מטעים). בלי session: h1 ריק ו"מספר סניף" ריק.
  // לחיצה בעץ (F2): session.instituteId = הסניף שנלחץ, טעינה מלאה לאותה כתובת.
  // "עריכה" בגריד (F4): session.studyTypeId = הסוג שנבחר, טעינה מלאה ל-/StudyType/StudyTypeDetails.aspx בלי query.
  const D = window.__mockDb, C = window.__mockCommon;
  const db = D.load();
  const urlInstituteId = D.query('InstituteID');
  const urlInst = D.instituteOf(db, urlInstituteId);
  const sessionId = D.session(db).instituteId;
  const sessionInst = D.instituteOf(db, sessionId);
  const TAB_ID = 'ContentPlaceHolder1_tabInstituteDetails';
  const TAB_TARGET = 'ctl00$ContentPlaceHolder1$tabInstituteDetails';
  const ST_BASE = 'ContentPlaceHolder1_tabInstituteDetails_TabPanel2_InsStudyTypes_ucStudyTypeSearch';
  const ST_GRID_ID = ST_BASE + '_gvStudyType';
  const ST_PAGER_TARGET = 'ctl00$ContentPlaceHolder1$tabInstituteDetails$TabPanel2$InsStudyTypes$ucStudyTypeSearch$gvStudyType';
  const PAGE_SIZE = 8;
  let stPage = 1;
  let tabChangeInFlight = false; // F4: בזמן postback של הלשונית, "עריכה" נבלעת (הדף רק נטען מחדש)
  // "מצב הדף" = המוסד של ה-session (לא של הכתובת). null = עוד לא נקבע.
  const shown = sessionInst ? { id: sessionId, inst: sessionInst } : null;
  const EMPTY_INST = { name: '', branch: '' };

  window.__mockLog = (m) => console.log('[mock-site] ' + m);
  window.__mockInstituteExtensions = window.__mockInstituteExtensions || [];

  document.head.insertAdjacentHTML('beforeend', C.baseStyle());

  function crumbs() {
    // כמו באתר: פירורי-הלחם לפי הכתובת (מטעים כשה-session שונה)
    return urlInst
      ? ['בית', 'איתור עמותות ומוסדות', 'פרטי עמותה', 'איתור מוסד', urlInst.name, urlInst.branch]
      : ['בית', 'איתור עמותות ומוסדות', 'פרטי עמותה', 'איתור מוסד', 'פרטי מוסד'];
  }

  function studyTypePanelHtml() {
    return `
      <div id="${ST_BASE}_upGrid"></div>
      <input type="hidden" id="${ST_BASE}_hidStudyTypeID" value="">
      <a id="ContentPlaceHolder1_btnUpdateStudyType" class="btn" disabled="true"
         href="javascript:__doPostBack('ctl00$ContentPlaceHolder1$btnUpdateStudyType','')">עריכה</a>`;
  }

  function render() {
    const root = document.getElementById('mock-root');
    const inst = shown ? shown.inst : EMPTY_INST;
    const h1 = shown ? `${inst.name} סניף ${inst.branch}` : '';
    root.innerHTML = C.treeHtml(db) + `
<div class="page">
  ${C.headerHtml(h1, crumbs(), { h1: 'ContentPlaceHolder1_headerInstitutesDetails', span: 'ContentPlaceHolder1_lblInsName' })}
  <div>מספר סניף: <span id="ContentPlaceHolder1_lblInsBranchNumber">${C.esc(inst.branch)}</span></div>
  <div id="${TAB_ID}">
    <div class="ajax__tab_header">
      <span class="ajax__tab_tab" data-tab-header="0" id="__tab_${TAB_ID}_TabPanel0">פרטי מוסד</span>
      <span class="ajax__tab_tab" data-tab-header="1" id="__tab_${TAB_ID}_TabPanel2">סוגי לימוד למוסד</span>
      <span class="ajax__tab_tab" data-tab-header="2" id="__tab_${TAB_ID}_TabInstituteEntitlement">מצב תמיכה</span>
      <span class="ajax__tab_tab" data-tab-header="3" id="__tab_${TAB_ID}_TabPanel1">תלמידים למוסד</span>
      <span class="ajax__tab_tab" data-tab-header="4" id="__tab_${TAB_ID}_TabPanel4">ימי היעדרות</span>
    </div>
    <div data-tab-index="0" id="${TAB_ID}_TabPanel0"><p>${shown ? `שם מוסד: ${C.esc(inst.name)} · סניף ${C.esc(inst.branch)} · מזהה ${C.esc(shown.id)}` : ''}</p></div>
    <div data-tab-index="1" id="${TAB_ID}_TabPanel2" style="display:none">${studyTypePanelHtml()}</div>
    <div data-tab-index="2" id="${TAB_ID}_TabInstituteEntitlement" style="display:none"></div>
    <div data-tab-index="3" id="${TAB_ID}_TabPanel1" style="display:none"></div>
    <div data-tab-index="4" id="${TAB_ID}_TabPanel4" style="display:none"><p>ימי היעדרות</p></div>
  </div>
</div>` + C.messagePopupHtml();
    C.wireMessageButtons();
    document.querySelectorAll('[data-tab-header]').forEach((el) => {
      el.addEventListener('click', () => { const t = window.__mock.components[TAB_ID]; if (t) t.set_activeTabIndex(Number(el.getAttribute('data-tab-header'))); });
    });
    renderStGrid();
    for (const ext of window.__mockInstituteExtensions) {
      try { if (ext.render) ext.render({ db, instituteId: shown ? shown.id : null, inst, tabId: TAB_ID }); } catch (e) { console.error('[mock] ext render', e); }
    }
    window.__mock.components[TAB_ID] = window.__mockTabs(TAB_ID, 5, 0, { postbackTarget: TAB_TARGET });
  }

  function currentStList() { return shown ? D.studyTypesOf(db, shown.id) : []; }

  function renderStGrid() {
    const list = currentStList();
    const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (stPage > pages) stPage = pages;
    const slice = list.slice((stPage - 1) * PAGE_SIZE, stPage * PAGE_SIZE);
    let html = `<table class="grid" id="${ST_GRID_ID}">
<tr><th>קוד סוג לימודים</th><th>תיאור</th><th>שעות שבועיות</th><th>מצב זכאות</th><th>מס' מדווחים</th><th>מס' נתמכים</th><th>תאריך הכרה</th></tr>`;
    slice.forEach((st, i) => {
      html += `<tr onclick="javascript:selectedRowStudyType('${i}');" style="cursor:pointer"><td>${C.esc(st.code)}</td><td>${C.esc(st.desc)}</td><td>40</td><td>${C.esc(st.status)}</td><td>${D.enrolledOf(db, st.id).length}</td><td>0</td><td>13/09/1995</td></tr>`;
    });
    if (pages > 1) {
      // כמו GridView אמיתי (ממצא ב-8): שורת-פייג'ר עם טבלה מקוננת, תא לכל מספר-עמוד. ה-tr-ים המקוננים
      // נראים כשורות של הגריד למי שקורא table.querySelectorAll('tr').
      const cells = [];
      for (let p = 1; p <= pages; p++) {
        cells.push(`<td>${p === stPage ? `<span>${p}</span>` : `<a href="javascript:__doPostBack('${ST_PAGER_TARGET}','Page$${p}')">${p}</a>`}</td>`);
      }
      html += `<tr class="pager"><td colspan="7"><table border="0"><tbody><tr>${cells.join('')}</tr></tbody></table></td></tr>`;
    }
    html += '</table>';
    document.getElementById(`${ST_BASE}_upGrid`).innerHTML = html;
    document.getElementById(`${ST_BASE}_hidStudyTypeID`).value = '';
    document.getElementById('ContentPlaceHolder1_btnUpdateStudyType').setAttribute('disabled', 'true');
  }

  // פונקציה גלובלית של האתר (צד-לקוח בלבד): בוחרת שורה ומפעילה "עריכה".
  window.selectedRowStudyType = function (n) {
    const hid = document.getElementById(`${ST_BASE}_hidStudyTypeID`);
    if (!hid) return; // F4: בזמן postback של הלשונית הפקדים לא קיימים: הבחירה הולכת לאיבוד
    hid.value = String(n);
    const rows = document.querySelectorAll(`#${ST_GRID_ID} tr[onclick]`);
    rows.forEach((tr, i) => tr.classList.toggle('selected', i === Number(n)));
    document.getElementById('ContentPlaceHolder1_btnUpdateStudyType').removeAttribute('disabled');
  };

  window.__mock = {
    components: {},
    postback(target, arg) {
      const m = C.handleMessagePostback(target);
      if (m) return m;

      // F2: העץ קובע את ה-session ומנווט לאותה כתובת (הכתובת לא משתנה)
      const t = C.handleTreePostback(db, target, arg, location.pathname + location.search);
      if (t) return t;

      // F4 (מתוקן): שינוי לשונית = postback א-סינכרוני. במהלכו $find מחזיר null, והגריד והכפתור "עריכה"
      // נעלמים ונבנים מחדש בסיום (כך בחירה או "עריכה" שנורו לפני הסיום הולכות לאיבוד).
      if (target === TAB_TARGET) {
        const tm = /^activeTabChanged:(\d+)$/.exec(arg || '');
        if (!tm) return { kind: 'none' };
        const tabs = window.__mock.components[TAB_ID];
        window.__mock.components[TAB_ID] = null;
        tabChangeInFlight = true;
        const panel = document.getElementById(`${TAB_ID}_TabPanel2`);
        panel.innerHTML = '';
        return { kind: 'async', apply: () => {
          panel.innerHTML = studyTypePanelHtml();
          stPage = 1;
          renderStGrid();
          tabChangeInFlight = false;
          window.__mock.components[TAB_ID] = tabs;
          tabs._commit(tm[1]);
        } };
      }

      if (target === ST_PAGER_TARGET) {
        const pm = /^Page\$(Next|Prev|\d+)$/.exec(arg || '');
        if (!pm) return { kind: 'none' };
        return { kind: 'async', apply: () => {
          if (pm[1] === 'Next') stPage++; else if (pm[1] === 'Prev') stPage = Math.max(1, stPage - 1); else stPage = Number(pm[1]);
          renderStGrid();
        } };
      }

      if (target === 'ctl00$ContentPlaceHolder1$btnUpdateStudyType') {
        if (tabChangeInFlight || !shown) {
          // F4: "עריכה" שנורתה בזמן שהלשונית עוד נטענת נבלעת: הדף רק נטען מחדש כדף מוסד
          D.log(db, 'btnUpdateStudyType swallowed (tab change in flight)');
          return { kind: 'navigate', url: location.pathname + location.search };
        }
        const hid = document.getElementById(`${ST_BASE}_hidStudyTypeID`);
        const n = hid ? hid.value : '';
        if (n === '') return { kind: 'none' };
        const list = currentStList();
        const st = list[(stPage - 1) * PAGE_SIZE + Number(n)];
        if (!st) return { kind: 'none' };
        // F3/F4: סוג-הלימוד הנוכחי נקבע ב-session; הכתובת של דף סוג-הלימוד בלי query
        D.setSession(db, { instituteId: shown.id, studyTypeId: st.id });
        return { kind: 'navigate', url: '/StudyType/StudyTypeDetails.aspx' };
      }

      for (const ext of window.__mockInstituteExtensions) {
        try {
          const r = ext.postback && ext.postback(target, arg, { db, instituteId: shown ? shown.id : null, inst: shown ? shown.inst : EMPTY_INST, save: () => D.save(db) });
          if (r) return r;
        } catch (e) { console.error('[mock] ext postback', e); }
      }
      return { kind: 'none' };
    },
    afterPostback() { D.save(db); },
  };

  // הרינדור נקרא בסוף ה-body, אחרי שקבצי-ההרחבה (עזיבה, דיווח) רשמו את הלשוניות שלהם.
  window.__mockInstituteRender = render;
})();
</script>
<script src="/mock/institute-ext.js"></script>
<script src="/mock/ext-depart.js"></script>
<script src="/mock/ext-report.js"></script>
<script>window.__mockInstituteRender();</script>
</body>
</html>
