<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>פרטי מוסד - תלמו"ד (דמה)</title>
<script src="/mock/shim.js"></script>
<script src="/mock/db.js"></script>
<script src="/mock/common.js"></script>
</head>
<body>
<form id="aspnetForm" onsubmit="return false">
<div id="mock-root"></div>
</form>
<script>
(function () {
  'use strict';
  const D = window.__mockDb, C = window.__mockCommon;
  const db = D.load();
  const instituteId = D.query('InstituteID');
  const inst = D.instituteOf(db, instituteId);
  const TAB_ID = 'ContentPlaceHolder1_tabInstituteDetails';
  const ST_BASE = 'ContentPlaceHolder1_tabInstituteDetails_TabPanel2_InsStudyTypes_ucStudyTypeSearch';
  const ST_GRID_ID = ST_BASE + '_gvStudyType';
  const ST_PAGER_TARGET = 'ctl00$ContentPlaceHolder1$tabInstituteDetails$TabPanel2$InsStudyTypes$ucStudyTypeSearch$gvStudyType';
  const PAGE_SIZE = 8;
  let stPage = 1;
  // "מצב הדף" — הסניף שמוצג (עשוי להיות שונה מה-URL אחרי קליק-עץ שמרנדר במקום)
  let shown = inst ? { id: instituteId, inst } : null;

  window.__mockLog = (m) => console.log('[mock-site] ' + m);
  window.__mockInstituteExtensions = window.__mockInstituteExtensions || [];

  document.head.insertAdjacentHTML('beforeend', C.baseStyle());

  function render() {
    const root = document.getElementById('mock-root');
    if (!shown) {
      root.innerHTML = C.treeHtml(db) + `<div class="page">${C.headerHtml('מוסד לא נמצא', ['בית'])}<p>InstituteID לא ידוע.</p></div>` + C.messagePopupHtml();
      C.wireMessageButtons();
      return;
    }
    const h1 = `${shown.inst.name} סניף ${shown.inst.branch}`;
    root.innerHTML = C.treeHtml(db) + `
<div class="page">
  ${C.headerHtml(h1, ['בית', 'איתור עמותות ומוסדות', 'פרטי עמותה', 'איתור מוסד', 'פרטי מוסד'])}
  <div>מספר סניף: <span id="ContentPlaceHolder1_lblBranch">${C.esc(shown.inst.branch)}</span></div>
  <div id="${TAB_ID}">
    <div class="ajax__tab_header">
      <span class="ajax__tab_tab" data-tab-header="0" id="__tab_${TAB_ID}_TabPanel0">פרטי מוסד</span>
      <span class="ajax__tab_tab" data-tab-header="1" id="__tab_${TAB_ID}_TabPanel2">סוגי לימוד למוסד</span>
      <span class="ajax__tab_tab" data-tab-header="2" id="__tab_${TAB_ID}_TabInstituteEntitlement">מצב תמיכה</span>
      <span class="ajax__tab_tab" data-tab-header="3" id="__tab_${TAB_ID}_TabPanel1">תלמידים למוסד</span>
      <span class="ajax__tab_tab" data-tab-header="4" id="__tab_${TAB_ID}_TabPanel4">ימי היעדרות</span>
    </div>
    <div data-tab-index="0" id="${TAB_ID}_TabPanel0"><p>שם מוסד: ${C.esc(shown.inst.name)} · סניף ${C.esc(shown.inst.branch)} · מזהה ${C.esc(shown.id)}</p></div>
    <div data-tab-index="1" id="${TAB_ID}_TabPanel2" style="display:none">
      <div id="${ST_BASE}_upGrid"></div>
      <input type="hidden" id="${ST_BASE}_hidStudyTypeID" value="">
      <input type="button" class="btn" id="ContentPlaceHolder1_btnUpdateStudyType" value="עריכה" disabled
             onclick="__doPostBack('ctl00$ContentPlaceHolder1$btnUpdateStudyType','')">
    </div>
    <div data-tab-index="2" id="${TAB_ID}_TabInstituteEntitlement" style="display:none"></div>
    <div data-tab-index="3" id="${TAB_ID}_TabPanel1" style="display:none"></div>
    <div data-tab-index="4" id="${TAB_ID}_TabPanel4" style="display:none"><p>ימי היעדרות</p></div>
  </div>
</div>` + C.messagePopupHtml();
    C.wireMessageButtons();
    document.querySelectorAll('[data-tab-header]').forEach((el) => {
      el.addEventListener('click', () => window.__mock.components[TAB_ID].set_activeTabIndex(Number(el.getAttribute('data-tab-header'))));
    });
    renderStGrid();
    for (const ext of window.__mockInstituteExtensions) {
      try { if (ext.render) ext.render({ db, instituteId: shown.id, inst: shown.inst, tabId: TAB_ID }); } catch (e) { console.error('[mock] ext render', e); }
    }
    window.__mock.components[TAB_ID] = window.__mockTabs(TAB_ID, 5, 0);
  }

  function currentStList() { return D.studyTypesOf(db, shown.id); }

  function renderStGrid() {
    const list = currentStList();
    const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (stPage > pages) stPage = pages;
    const slice = list.slice((stPage - 1) * PAGE_SIZE, stPage * PAGE_SIZE);
    let html = `<table class="grid" id="${ST_GRID_ID}">
<tr><th>קוד סוג לימודים</th><th>תיאור</th><th>שעות שבועיות</th><th>מצב זכאות</th><th>מס' מדווחים</th><th>מס' נתמכים</th><th>תאריך הכרה</th></tr>`;
    slice.forEach((st, i) => {
      html += `<tr onclick="selectedRowStudyType('${i}')" style="cursor:pointer"><td>${C.esc(st.code)}</td><td>${C.esc(st.desc)}</td><td>40</td><td>${C.esc(st.status)}</td><td>${D.enrolledOf(db, st.id).length}</td><td>0</td><td>13/09/1995</td></tr>`;
    });
    if (pages > 1) {
      const links = [];
      for (let p = 1; p <= pages; p++) {
        links.push(p === stPage ? `<span>${p}</span>` : `<a href="javascript:__doPostBack('${ST_PAGER_TARGET}','Page$${p}')">${p}</a>`);
      }
      html += `<tr class="pager"><td colspan="7">${links.join(' ')}</td></tr>`;
    }
    html += '</table>';
    document.getElementById(`${ST_BASE}_upGrid`).innerHTML = html;
    document.getElementById(`${ST_BASE}_hidStudyTypeID`).value = '';
    document.getElementById('ContentPlaceHolder1_btnUpdateStudyType').disabled = true;
  }

  // פונקציה גלובלית של האתר (צד-לקוח בלבד): בוחרת שורה ומפעילה "עריכה".
  window.selectedRowStudyType = function (n) {
    document.getElementById(`${ST_BASE}_hidStudyTypeID`).value = String(n);
    const rows = document.querySelectorAll(`#${ST_GRID_ID} tr[onclick]`);
    rows.forEach((tr, i) => tr.classList.toggle('selected', i === Number(n)));
    document.getElementById('ContentPlaceHolder1_btnUpdateStudyType').disabled = false;
  };

  window.__mock = {
    components: {},
    postback(target, arg) {
      const m = C.handleMessagePostback(target);
      if (m) return m;

      if (target === 'ctl00$ucTalmudSideBar$tvTalmud') {
        const mm = /\\(\d{2})$/.exec(arg || '');
        if (!mm) return { kind: 'none' };
        const branch = mm[1];
        const id = D.branchToInstituteId(db, branch);
        if (!id) return { kind: 'async', apply: () => C.showMessage('סניף לא נמצא', ['ok']) };
        if (db.treeNavigates !== false) return { kind: 'navigate', url: `/Institutes/InstitutesDetails.aspx?InstituteID=${id}` };
        // רינדור במקום (אותה כתובת) — הדמיה של התנהגות אפשרית של האתר
        return { kind: 'async', apply: () => { shown = { id, inst: D.instituteOf(db, id) }; stPage = 1; render(); } };
      }

      if (target === ST_PAGER_TARGET) {
        const pm = /^Page\$(Next|Prev|\d+)$/.exec(arg || '');
        if (!pm) return { kind: 'none' };
        return { kind: 'async', apply: () => {
          if (pm[1] === 'Next') stPage++; else if (pm[1] === 'Prev') stPage = Math.max(1, stPage - 1); else stPage = Number(pm[1]);
          renderStGrid();
        } };
      }

      if (target === 'ctl00$ContentPlaceHolder1$btnUpdateStudyType') {
        const n = document.getElementById(`${ST_BASE}_hidStudyTypeID`).value;
        if (n === '') return { kind: 'none' };
        const list = currentStList();
        const st = list[(stPage - 1) * PAGE_SIZE + Number(n)];
        if (!st) return { kind: 'none' };
        // ניווט מלא לדף סוג-הלימוד; הכתובת מקודדת גם את המוסד האמיתי (עובדה מהאתר)
        return { kind: 'navigate', url: `/StudyType/StudyTypeDetails.aspx?InstituteStudyTypeID=${st.id}&InstituteID=${shown.id}` };
      }

      for (const ext of window.__mockInstituteExtensions) {
        try {
          const r = ext.postback && ext.postback(target, arg, { db, instituteId: shown.id, inst: shown.inst, save: () => D.save(db) });
          if (r) return r;
        } catch (e) { console.error('[mock] ext postback', e); }
      }
      return { kind: 'none' };
    },
    afterPostback() { D.save(db); },
  };

  render();
})();
</script>
<script src="/mock/institute-ext.js"></script>
</body>
</html>
