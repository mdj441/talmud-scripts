<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>פרטי סוג לימוד - תלמו"ד (דמה)</title>
<script src="/mock/shim.js"></script>
<script src="/mock/db.js"></script>
<script src="/mock/common.js"></script>
</head>
<body>
<form id="aspnetForm" onsubmit="return false">
<div id="mock-root"></div>
</form>
<script>
(function () {
  'use strict';
  const D = window.__mockDb, C = window.__mockCommon;
  const db = D.load();
  const stId = D.query('InstituteStudyTypeID');
  const st = db.studyTypes[String(stId)] || null;
  const instituteId = st ? st.instituteId : D.query('InstituteID');
  const inst = D.instituteOf(db, instituteId);
  const TAB_ID = 'ContentPlaceHolder1_tabStudyTypeDetails';
  const BASE = 'ContentPlaceHolder1_tabStudyTypeDetails_StudentList_ucStudentsSearchDetails';
  const T = 'ctl00$ContentPlaceHolder1$tabStudyTypeDetails$StudentList$ucStudentsSearchDetails';
  const today = (() => { const d = new Date(); return [String(d.getDate()).padStart(2, '0'), String(d.getMonth() + 1).padStart(2, '0'), d.getFullYear()].join('/'); })();

  window.__mockLog = (m) => console.log('[mock-site] ' + m);
  document.head.insertAdjacentHTML('beforeend', C.baseStyle());

  const COUNTRIES = [['-1', 'בחירה'], ['100', 'אפגניסטן'], ['710', 'ארצות הברית'], ['620', 'בלגיה'], ['590', 'הממלכה המאוחדת'], ['640', 'צרפת'], ['700', 'קנדה'], ['860', 'אוסטרליה'], ['510', 'אוסטריה'], ['306', 'רוסיה'], ['500', 'גרמניה']];

  function gridHtml(students) {
    if (!students.length) return ''; // GridView ריק אינו מרונדר כלל (עובדה מהאתר)
    // ממצא ב-3: עם gridIdColumnShifted עמודה נוספת ("סניף") נדחפת לפני המזהה, ועמודה 3 אינה עמודת המזהה
    const shifted = db.gridIdColumnShifted === true;
    const extraTh = shifted ? '<th>סניף</th>' : '';
    let html = `<table class="grid" id="${BASE}_gvIStudents"><tr><th></th><th>סדר קליטה</th><th>סוג מזהה</th>${extraTh}<th>ת.ז. / דרכון</th><th>שם</th><th>שם משפחה</th><th>תאריך לידה</th><th>סוג לימוד</th><th>תאריך קליטה</th><th>תאריך עזיבה</th><th>מצב אישור מעבר בין מ...</th></tr>`;
    students.forEach((s, i) => {
      const extraTd = shifted ? `<td>${C.esc(inst.branch)}</td>` : '';
      html += `<tr><td><input type="checkbox"></td><td>${i + 1}</td><td>${s.idType === '2' ? 'דרכון' : 'תעודת זהות'}</td>${extraTd}<td>${C.esc(s.id)}</td><td>${C.esc(s.first)}</td><td>${C.esc(s.last)}</td><td>${C.esc(s.birth || '')}</td><td>${C.esc(st.code)}</td><td>${C.esc(s.accepted || today)}</td><td></td><td></td></tr>`;
    });
    return html + '</table>';
  }

  function resultsHtml(students) {
    return `<span id="${BASE}_lblCountSearch">נמצאו ${students.length} רשומות בהתאם לקריטריון החיפוש</span>${gridHtml(students)}`;
  }

  function render() {
    const root = document.getElementById('mock-root');
    if (!st || !inst) {
      root.innerHTML = C.treeHtml(db) + `<div class="page">${C.headerHtml('שגיאה', ['בית'])}<p>סוג לימוד לא נמצא.</p></div>` + C.messagePopupHtml();
      C.wireMessageButtons();
      return;
    }
    const crumbs = db.breadcrumbShowsBranch === false
      ? ['בית', 'איתור עמותות ומוסדות', 'פרטי עמותה', 'איתור מוסד', 'פרטי מוסד']
      : ['בית', 'איתור עמותות ומוסדות', 'פרטי עמותה', 'איתור מוסד', inst.name, inst.branch, `(${st.code})${st.desc}`];
    root.innerHTML = C.treeHtml(db) + `
<div class="page">
  ${C.headerHtml(`סוג לימוד ${st.code} - ${st.desc}`, crumbs)}
  <div id="${TAB_ID}">
    <div class="ajax__tab_header">
      <span class="ajax__tab_tab" data-tab-header="0">פרטי סוג לימוד</span>
      <span class="ajax__tab_tab" data-tab-header="1">מצב זכאות סוג לימוד</span>
      <span class="ajax__tab_tab" data-tab-header="2">רשימת תלמידים</span>
    </div>
    <div data-tab-index="0"><p>קוד ${C.esc(st.code)} · ${C.esc(st.desc)} · מצב זכאות: ${C.esc(st.status)}</p></div>
    <div data-tab-index="1" style="display:none"><p>מצב זכאות: ${C.esc(st.status)}</p></div>
    <div data-tab-index="2" style="display:none">
      <div style="margin:6px 0">
        חיפוש ת.ז./דרכון: <input type="text" id="${BASE}_txtStudenPassport">
        <input type="submit" class="btn" id="${BASE}_btnSearch" value="חפש" onclick="ShowLoaderPopUp();__doPostBack('${T}$btnSearch','');return false;">
        <select id="${BASE}_ddlStudyTypeID"><option value="${C.esc(st.code)}">${C.esc(st.code)}</option></select>
      </div>
      <div id="${BASE}_upResults">${resultsHtml(D.enrolledOf(db, stId))}</div>
      <div style="margin-top:8px">
        <input type="button" class="btn" id="ContentPlaceHolder1_btnStudentAcceptence3" value="קליטה" onclick="__doPostBack('ctl00$ContentPlaceHolder1$btnStudentAcceptence3','')">
        <input type="button" class="btn" id="ContentPlaceHolder1_btnStudentDeparture3" value="עזיבה">
      </div>
      <div id="${BASE}_pnlAcceptStudent" class="AjaxModalpopup" style="display:none;position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid #345;padding:16px 24px;z-index:900;min-width:360px">
        <div style="font-weight:bold;margin-bottom:8px">קליטת תלמיד</div>
        <div>סוג מזהה: <select id="${BASE}_ddlPopIdentityType"><option value="-1">בחירה</option><option value="1">תעודת זהות</option><option value="2">דרכון</option></select></div>
        <div>מספר ת.ז./דרכון: <input type="text" id="${BASE}_txtIdentifier"> <span class="validator" id="${BASE}_valIdentifier">ת.ז/דרכון הינו חובה</span> <span class="validator" id="${BASE}_valIdentifierFormat">מספר זהות לא חוקי</span></div>
        <div id="${BASE}_trCountry" style="display:none">ארץ דרכון: <select id="${BASE}_ddlCountryOfOrigine">${COUNTRIES.map(([v, n]) => `<option value="${v}">${C.esc(n)}</option>`).join('')}</select> <span class="validator" id="${BASE}_valCountry">ארץ דרכון הינו חובה</span></div>
        <div id="${BASE}_trBirth" style="display:none">תאריך לידה: <input type="text" id="${BASE}_ctlBirthDate_txtDate" value="09/09/2009"> <span class="validator" id="${BASE}_valBirth">תאריך לידה הינו חובה</span></div>
        <div>תאריך תחילת לימודים: <input type="text" id="${BASE}_ctlAcceptanceDate_txtDate" value="${today}"></div>
        <div style="margin-top:10px">
          <a id="${BASE}_LinkButton1" class="btn" href="javascript:WebForm_DoPostBackWithOptions(new WebForm_PostBackOptions(&quot;${T}$LinkButton1&quot;, &quot;&quot;, true, &quot;PopValidation&quot;, &quot;&quot;, false, true))">אישור</a>
          <a id="${BASE}_LinkButton2" class="btn" href="javascript:__doPostBack('${T}$LinkButton2','')">ביטול</a>
        </div>
      </div>
    </div>
  </div>
</div>` + C.messagePopupHtml();
    C.wireMessageButtons();
    document.querySelectorAll('[data-tab-header]').forEach((el) => {
      el.addEventListener('click', () => window.__mock.components[TAB_ID].set_activeTabIndex(Number(el.getAttribute('data-tab-header'))));
    });
    window.__mock.components[TAB_ID] = window.__mockTabs(TAB_ID, 3, 0);
    window.__mock.components[`${BASE}_pnlAcceptStudent_ModalPopupExtender`] = window.__mockModal(`${BASE}_pnlAcceptStudent`);
    window.__mock.components['ucMessagePopUp_ModalPopupExtender1'] = window.__mockModal('ucMessagePopUp_pnlMessagePopup');

    const ddl = document.getElementById(`${BASE}_ddlPopIdentityType`);
    const syncIdType = () => {
      const passport = ddl.value === '2';
      document.getElementById(`${BASE}_trCountry`).style.display = passport ? '' : 'none';
      document.getElementById(`${BASE}_trBirth`).style.display = passport ? '' : 'none';
    };
    ddl.addEventListener('change', syncIdType);
    document.getElementById(`${BASE}_ddlCountryOfOrigine`).value = '100';

    // ולידטורים של קבוצת PopValidation (כמו באתר: "אישור" מריץ אותם לפני ה-postback)
    const val = (id, el, check) => ({ validationgroup: 'PopValidation', el: document.getElementById(id), errormessage: document.getElementById(id).textContent, check, get textContent() { return this.errormessage; } });
    window.Page_Validators = [
      val(`${BASE}_valIdentifier`, null, () => document.getElementById(`${BASE}_txtIdentifier`).value.trim() !== ''),
      val(`${BASE}_valIdentifierFormat`, null, () => ddl.value !== '1' || /^\d{9}$/.test(document.getElementById(`${BASE}_txtIdentifier`).value.trim())),
      val(`${BASE}_valCountry`, null, () => ddl.value !== '2' || document.getElementById(`${BASE}_ddlCountryOfOrigine`).value !== '-1'),
      val(`${BASE}_valBirth`, null, () => ddl.value !== '2' || /^\d{2}\/\d{2}\/\d{4}$/.test(document.getElementById(`${BASE}_ctlBirthDate_txtDate`).value.trim())),
    ];
  }

  function openModal() {
    document.getElementById(`${BASE}_ddlPopIdentityType`).value = '-1';
    document.getElementById(`${BASE}_txtIdentifier`).value = '';
    document.getElementById(`${BASE}_ctlBirthDate_txtDate`).value = '09/09/2009';
    document.getElementById(`${BASE}_ddlCountryOfOrigine`).value = '100';
    document.getElementById(`${BASE}_ctlAcceptanceDate_txtDate`).value = today;
    document.getElementById(`${BASE}_trCountry`).style.display = 'none';
    document.getElementById(`${BASE}_trBirth`).style.display = 'none';
    window.__mock.components[`${BASE}_pnlAcceptStudent_ModalPopupExtender`].show();
  }
  function closeModal() { window.__mock.components[`${BASE}_pnlAcceptStudent_ModalPopupExtender`].hide(); }

  window.__mock = {
    components: {},
    postback(target, arg) {
      const m = C.handleMessagePostback(target);
      if (m) return m;
      if (!st) return { kind: 'none' };

      if (target === `${T}$btnSearch`) {
        const q = document.getElementById(`${BASE}_txtStudenPassport`).value.trim();
        return { kind: 'async', apply: () => {
          const list = q ? D.findEnrolled(db, stId, q) : D.enrolledOf(db, stId);
          D.log(db, `search "${q}" → ${list.length}`);
          document.getElementById(`${BASE}_upResults`).innerHTML = resultsHtml(list);
        } };
      }

      if (target === 'ctl00$ContentPlaceHolder1$btnStudentAcceptence3') {
        return { kind: 'async', apply: () => {
          if (st.status === 'סגור') { C.showMessage('לא ניתן לקלוט תלמידים לסוג לימוד סגור', ['ok']); return; }
          openModal();
        } };
      }

      if (target === `${T}$LinkButton2`) return { kind: 'async', apply: closeModal };

      if (target === `${T}$LinkButton1`) {
        const idType = document.getElementById(`${BASE}_ddlPopIdentityType`).value;
        const raw = document.getElementById(`${BASE}_txtIdentifier`).value.trim();
        const id = idType === '2' ? raw.toUpperCase() : D.pad9(raw);
        const birth = document.getElementById(`${BASE}_ctlBirthDate_txtDate`).value.trim();
        const country = document.getElementById(`${BASE}_ddlCountryOfOrigine`).value;
        const accepted = document.getElementById(`${BASE}_ctlAcceptanceDate_txtDate`).value.trim() || today;
        // ולידציה צד-שרת (אם הסקריפט עקף את הצד-לקוח)
        if (!raw || idType === '-1' || (idType === '1' && !/^\d{9}$/.test(id)) || (idType === '2' && (country === '-1' || !birth))) {
          return { kind: 'async', apply: () => { window.Page_ClientValidate('PopValidation'); D.log(db, 'confirm rejected by validation'); } };
        }
        if (db.blocked && db.blocked[id]) {
          return { kind: 'async', apply: () => { closeModal(); C.showMessage(db.blocked[id], ['continue', 'no']); D.log(db, `confirm ${id} → blocked/confirm`); } };
        }
        if (D.findEnrolled(db, stId, id).length) {
          return { kind: 'async', apply: () => { closeModal(); C.showMessage('התלמיד כבר קיים בסוג לימוד זה', ['ok']); D.log(db, `confirm ${id} → already enrolled`); } };
        }
        // "מוכר למערכת" = ברשימת המוכרים, או רשום בסוג-לימוד כלשהו (המערכת כבר מכירה אותו)
        let known = db.known && db.known[id];
        if (!known) {
          for (const list of Object.values(db.enrolled || {})) {
            const hit = list.find((s) => D.norm(s.id) === D.norm(id));
            if (hit) { known = { first: hit.first, last: hit.last, birth: hit.birth }; break; }
          }
        }
        if (known) {
          return { kind: 'async', apply: () => {
            D.enroll(db, stId, { id, idType, first: known.first, last: known.last, birth: known.birth || birth, accepted, country: idType === '2' ? country : undefined });
            closeModal();
            D.log(db, `confirm ${id} → enrolled`);
            // כמו באתר: הודעת-הצלחה עם כפתור "המשך" גלוי
            C.showMessage('הצלחה קליטת תלמיד הצליחה', ['continue']);
          } };
        }
        // תלמיד שאינו מוכר למערכת → ניווט מלא לדף תלמיד-חדש
        db.pendingNewStudent = { id, idType, studyTypeInstId: String(stId), instituteId: String(instituteId), birth: idType === '2' ? birth : '', country: idType === '2' ? country : '', accepted };
        D.save(db);
        D.log(db, `confirm ${id} → new student page`);
        return { kind: 'navigate', url: '/Students/StudentsDetails.aspx?' };
      }

      return { kind: 'none' };
    },
    onContinue() { D.log(db, 'user clicked המשך'); },
    afterPostback() { D.save(db); },
  };

  render();
})();
</script>
</body>
</html>
