<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>תלמו"ד (דמה) - כניסה</title>
<script src="/mock/shim.js"></script>
<script src="/mock/db.js"></script>
<script src="/mock/common.js"></script>
</head>
<body>
<div id="mock-root"></div>
<script>
(function () {
  const D = window.__mockDb, C = window.__mockCommon;
  const db = D.load();
  document.head.insertAdjacentHTML('beforeend', C.baseStyle());
  const links = Object.entries(db.institutes).map(([id, i]) => `<li><a href="/Institutes/InstitutesDetails.aspx?InstituteID=${id}">סניף ${C.esc(i.branch)} (InstituteID=${id})</a></li>`).join('');
  document.getElementById('mock-root').innerHTML = `<div class="page" style="margin:0">
    <h1>סביבת-דמה של תלמו"ד</h1>
    <p>דפים: <ul>${links}<li><a href="/Association/Default.aspx">הודעות</a></li></ul></p>
    <p><button onclick="localStorage.removeItem('mock.talmud.db');location.reload()">אפס את מסד-הדמה</button></p>
  </div>`;
})();
</script>
</body>
</html>
