<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הודעות - תלמו"ד (דמה)</title>
<script src="/mock/shim.js"></script>
<script src="/mock/db.js"></script>
<script src="/mock/common.js"></script>
</head>
<body>
<form id="aspnetForm" onsubmit="return false">
<div id="mock-root"></div>
</form>
<script>
(function () {
  'use strict';
  // דף ההודעות של הדמה (/Association/Default.aspx). מזהי-DOM כמו באתר (לפי הסקריפט הישן v5.0 ועובדות
  // מהאתר החי, 30.10.2026): גריד GVMessages עם שורות selectedRowSearch('N') + שדות נסתרים hdID (גוף מלא) /
  // hidMessageHeader (נושא); עמודות: נושא, נמען, יחידה ארגונית, מצב הודעה, תאריך שליחה, גוף מקוצר, 2 ריקות;
  // 10 שורות לעמוד; פייג'ר GPager (« ‹ › » + span של העמוד); סינון מצב ddlMessageStatus עם "הכל" (-1,
  // ברירת-המחדל בטעינה) / נשלחה (1) / טופלה (2); HidMessageRowID; ושלושה postbacks של פעולה.
  // נוסחי ההודעות כמו באתר: "בקשת מעבר תלמיד" = מוסד אחר מבקש להעביר אליו תלמיד שלנו ("מסוג לימוד NNN בסניף NN"
  // = הסניף וסוג-הלימוד הנוכחיים שלו אצלנו); "מעבר תלמיד" = אינפורמטיבי (ממוסדך / אל מוסדך אושר).
  // הנחות הדמה (לא מאומתות מול האתר): הגריד מרונדר מחדש אחרי פעולה ונשאר באותו עמוד; פעולת "אישור/דחיית
  // מעבר" על הודעה שאינה בקשת-מעבר מציגה הודעת-שגיאה ולא משנה כלום. כל השמות והתעודות בדויים.
  const D = window.__mockDb, C = window.__mockCommon;
  const db = D.load();
  const GRID = 'ContentPlaceHolder1_GVMessages';
  const PAGER = 'ContentPlaceHolder1_GPager_pager';
  const DDL = 'ContentPlaceHolder1_ddlMessageStatus';
  const HID = 'ContentPlaceHolder1_HidMessageRowID';
  const PAGE_SIZE = 10;
  const TRANSFER = 'בקשת מעבר תלמיד';
  const TRANSFER_DONE = 'מעבר תלמיד';

  window.__mockLog = (m) => console.log('[mock-site] ' + m);
  document.head.insertAdjacentHTML('beforeend', C.baseStyle());

  function defaultMessages() {
    const request = (name, id, studyType, branch) => `מוסד אחר ביקש להעביר אליו את התלמיד ${name}, בעל ת.ז. ${id} מסוג לימוד ${studyType} בסניף ${branch}. אנא אשר או דחה את המעבר.`;
    const outDone = (name, idPhrase) => `מעבר התלמיד ${name}, ${idPhrase} ממוסדך אושר על ידי תהליך אישור אוטומטי.`;
    const inDone = (name, id) => `מעבר התלמיד ${name}, בעל ת.ז. ${id} אל מוסדך אושר על ידי המוסד בו הוא לומד.`;
    const sys = { to: 'מנהל מוסד', unit: 'מוסד הדמה' };
    return [
      { id: 'm01', header: TRANSFER, body: request('ראובן דמה', '012345678', '600', '09'), status: 'נשלחה', date: '01/09/2026', to: sys.to, unit: 'סניף 09' },
      { id: 'm02', header: 'עדכון פרטי תלמיד', body: 'עודכנו פרטי התלמיד ת.ז. 023456789: כתובת חדשה.', status: 'נשלחה', date: '01/09/2026', to: sys.to, unit: sys.unit },
      { id: 'm03', header: TRANSFER, body: request('שמעון דמה', '034567890', '600', '16'), status: 'נשלחה', date: '02/09/2026', to: sys.to, unit: 'סניף 16' },
      { id: 'm04', header: 'הודעה כללית', body: 'תזכורת: יש להשלים את הדיווח החודשי עד סוף החודש.', status: 'נשלחה', date: '02/09/2026', to: sys.to, unit: sys.unit },
      { id: 'm05', header: TRANSFER, body: request('לוי דמה', '045678901', '1200', '09'), status: 'נשלחה', date: '03/09/2026', to: sys.to, unit: 'סניף 09' },
      { id: 'm06', header: 'אישור קליטה', body: 'התלמיד בעל דרכון AB1234567 נקלט בהצלחה.', status: 'נשלחה', date: '03/09/2026', to: sys.to, unit: sys.unit },
      { id: 'm07', header: TRANSFER, body: request('יהודה דמה', '056789012', '600', '05'), status: 'נשלחה', date: '04/09/2026', to: sys.to, unit: 'סניף 05' },
      { id: 'm08', header: 'עדכון פרטי תלמיד', body: 'עודכנו פרטי התלמיד ת.ז. 067890123: שם משפחה.', status: 'נשלחה', date: '04/09/2026', to: sys.to, unit: sys.unit },
      { id: 'm09', header: TRANSFER, body: request('דן דמה', '078901234', '600', '16'), status: 'טופלה', date: '20/08/2026', to: sys.to, unit: 'סניף 16', handledBy: 'approve' },
      { id: 'm10', header: 'הודעה כללית', body: 'עדכון גרסה למערכת.', status: 'טופלה', date: '20/08/2026', to: sys.to, unit: sys.unit, handledBy: 'handled' },
      { id: 'm11', header: 'עדכון פרטי תלמיד', body: 'עודכנו פרטי התלמיד ת.ז. 089012345.', status: 'טופלה', date: '21/08/2026', to: sys.to, unit: sys.unit, handledBy: 'handled' },
      { id: 'm12', header: TRANSFER, body: request('נפתלי דמה', '090123456', '600', '05'), status: 'טופלה', date: '22/08/2026', to: sys.to, unit: 'סניף 05', handledBy: 'decline' },
      // כפילויות: m13 זהה ל-m01 (אותו גוף → אותו UID בסקריפט); m14 אותה בקשה כמו m03 בנוסח "תזכורת" (UID שונה, אותה ת.ז.).
      { id: 'm13', header: TRANSFER, body: request('ראובן דמה', '012345678', '600', '09'), status: 'נשלחה', date: '05/09/2026', to: sys.to, unit: 'סניף 09' },
      { id: 'm14', header: TRANSFER, body: request('שמעון דמה', '034567890', '600', '16') + ' (תזכורת)', status: 'נשלחה', date: '06/09/2026', to: sys.to, unit: 'סניף 16' },
      // בקשה חוזרת על תלמיד של m09 (כבר אושרה פעם): m15 פותחת את עמוד 2.
      { id: 'm15', header: TRANSFER, body: request('דן דמה', '078901234', '600', '16'), status: 'נשלחה', date: '06/09/2026', to: sys.to, unit: 'סניף 16' },
      // "מעבר תלמיד" אינפורמטיבי, שלושת הנוסחים מהאתר: ממוסדך עם ת.ז., ממוסדך עם דרכון, אל מוסדך.
      { id: 'm16', header: TRANSFER_DONE, body: outDone('גד דמה', 'בעל ת.ז. 100200300'), status: 'נשלחה', date: '07/09/2026', to: sys.to, unit: sys.unit },
      { id: 'm17', header: TRANSFER_DONE, body: outDone('אשר דמה', 'בעל דרכון CD7654321'), status: 'נשלחה', date: '07/09/2026', to: sys.to, unit: sys.unit },
      { id: 'm18', header: TRANSFER_DONE, body: inDone('יששכר דמה', '200300400'), status: 'נשלחה', date: '08/09/2026', to: sys.to, unit: sys.unit },
    ];
  }
  db.messages = db.messages || defaultMessages();
  D.save(db);

  // מצב-הדף (ViewState באתר): הסינון והעמוד הנוכחי. מתאפס בטעינה מלאה. בטעינה הסינון "הכל" (-1), כמו באתר.
  const state = { filter: String(db.messagesInitialFilter || '-1'), page: 1 };
  const STATUS_OF = { '1': 'נשלחה', '2': 'טופלה' };

  function filtered() { return state.filter === '-1' ? db.messages.slice() : db.messages.filter((m) => m.status === STATUS_OF[state.filter]); }
  function pageCount(list) { return Math.max(1, Math.ceil(list.length / PAGE_SIZE)); }
  function clampPage(list) { state.page = Math.min(Math.max(1, state.page), pageCount(list)); }
  function pageRows(list) { const s = (state.page - 1) * PAGE_SIZE; return list.slice(s, s + PAGE_SIZE); }

  function pagerHtml(list) {
    const n = pageCount(list), p = state.page;
    const link = (sym, target) => (target
      ? `<a href="javascript:__doPostBack('ctl00$ContentPlaceHolder1$GPager','Page$${target}')">${sym}</a>`
      : `<span class="pager-off" style="color:#999">${sym}</span>`);
    return `<div id="${PAGER}" style="margin-top:6px;font-size:14px">${link('«', p > 1 ? 1 : 0)} ${link('‹', p > 1 ? p - 1 : 0)} <span>${p}</span> מתוך ${n} ${link('›', p < n ? p + 1 : 0)} ${link('»', p < n ? n : 0)}</div>`;
  }

  function gridHtml(rows) {
    if (!rows.length) return '<div style="padding:8px;color:#666">אין הודעות</div>'; // GridView ריק אינו מרונדר
    // עמודות כמו באתר: 0 נושא, 1 נמען, 2 יחידה ארגונית, 3 מצב הודעה, 4 תאריך שליחה, 5 גוף מקוצר, 6-7 ריקות.
    let html = `<table class="grid" id="${GRID}"><tr><th>נושא ההודעה</th><th>נמען</th><th>יחידה ארגונית</th><th>מצב הודעה</th><th>תאריך שליחת הודעה</th><th>גוף ההודעה</th><th></th><th></th></tr>`;
    rows.forEach((m, i) => {
      const short = m.body.length > 40 ? m.body.slice(0, 40) + '...' : m.body;
      html += `<tr onclick="selectedRowSearch('${i}')"><td>${C.esc(m.header)}<input type="hidden" id="${GRID}_hdID_${i}" value="${C.esc(m.body)}"><input type="hidden" id="${GRID}_hidMessageHeader_${i}" value="${C.esc(m.header)}"></td>`
        + `<td>${C.esc(m.to || '')}</td><td>${C.esc(m.unit || '')}</td><td>${C.esc(m.status)}</td><td>${C.esc(m.date)}</td><td>${C.esc(short)}</td><td></td><td></td></tr>`;
    });
    return html + '</table>';
  }

  function renderGrid() {
    const list = filtered();
    clampPage(list);
    document.getElementById('ContentPlaceHolder1_upMessages').innerHTML = gridHtml(pageRows(list)) + pagerHtml(list);
  }

  function render() {
    const root = document.getElementById('mock-root');
    root.innerHTML = C.treeHtml(db) + `
<div class="page">
  ${C.headerHtml('הודעות', ['בית', 'הודעות'])}
  <div style="margin:6px 0">מצב הודעה:
    <select id="${DDL}" onchange="__doPostBack('ctl00$ContentPlaceHolder1$ddlMessageStatus','')">
      <option value="-1"${state.filter === '-1' ? ' selected' : ''}>הכל</option>
      <option value="1"${state.filter === '1' ? ' selected' : ''}>נשלחה</option>
      <option value="2"${state.filter === '2' ? ' selected' : ''}>טופלה</option>
    </select>
  </div>
  <input type="hidden" id="${HID}" value="">
  <div id="ContentPlaceHolder1_upMessages"></div>
  <div style="margin-top:8px">
    <input type="button" class="btn" id="ContentPlaceHolder1_btnTransferApprove" value="אישור מעבר" onclick="__doPostBack('ctl00$ContentPlaceHolder1$btnTransferApprove','')">
    <input type="button" class="btn" id="ContentPlaceHolder1_btnTransferDecline" value="דחיית מעבר" onclick="__doPostBack('ctl00$ContentPlaceHolder1$btnTransferDecline','')">
    <input type="button" class="btn" id="ContentPlaceHolder1_btnChangeMessageStatus" value="שנה מצב הודעה לטופל" onclick="__doPostBack('ctl00$ContentPlaceHolder1$btnChangeMessageStatus','')">
  </div>
</div>` + C.messagePopupHtml();
    C.wireMessageButtons();
    window.__mock.components['ucMessagePopUp_ModalPopupExtender1'] = window.__mockModal('ucMessagePopUp_pnlMessagePopup');
    renderGrid();
  }

  window.selectedRowSearch = function (n) {
    document.getElementById(HID).value = String(n);
  };

  const ACTIONS = {
    'ctl00$ContentPlaceHolder1$btnTransferApprove': 'approve',
    'ctl00$ContentPlaceHolder1$btnTransferDecline': 'decline',
    'ctl00$ContentPlaceHolder1$btnChangeMessageStatus': 'handled',
  };

  window.__mock = {
    components: {},
    postback(target, arg) {
      const m = C.handleMessagePostback(target);
      if (m) return m;

      if (target === 'ctl00$ContentPlaceHolder1$ddlMessageStatus') {
        const v = document.getElementById(DDL).value;
        return { kind: 'async', apply: () => { state.filter = v; state.page = 1; D.log(db, `messages filter → ${v}`); renderGrid(); } };
      }

      if (target === 'ctl00$ContentPlaceHolder1$GPager') {
        const list = filtered();
        const n = pageCount(list);
        let p = state.page;
        const mm = /^Page\$(\d+|Next|Prev|First|Last)$/.exec(arg || '');
        if (mm) {
          const a = mm[1];
          p = a === 'Next' ? p + 1 : a === 'Prev' ? p - 1 : a === 'First' ? 1 : a === 'Last' ? n : parseInt(a, 10);
        }
        return { kind: 'async', apply: () => { state.page = p; clampPage(list); D.log(db, `messages page → ${state.page}`); renderGrid(); } };
      }

      const how = ACTIONS[target];
      if (how) {
        const raw = document.getElementById(HID).value;
        return { kind: 'async', apply: () => {
          const list = filtered();
          clampPage(list);
          const idx = parseInt(raw, 10);
          const msg = Number.isFinite(idx) ? pageRows(list)[idx] : null;
          if (!msg) { C.showMessage('לא נבחרה הודעה', ['ok']); D.log(db, `${how}: no row (${raw})`); return; }
          // ממצא ב-4: אחרי פעולה האתר (אולי) חוזר לעמוד 1
          const resetPage = () => { if (db.messagesResetPageAfterAction === true) state.page = 1; };
          if (how !== 'handled' && msg.header !== TRANSFER) {
            C.showMessage('הפעולה אפשרית רק עבור בקשת מעבר תלמיד', ['ok']);
            D.log(db, `${how}: not a transfer request (${msg.id})`);
            resetPage();
            renderGrid();
            return;
          }
          if (Array.isArray(db.messagesStuck) && db.messagesStuck.includes(msg.id)) {
            // פעולה שלא נתפסה בשרת: חלונית-הצלחה, אך ההודעה נשארת "נשלחה"
            db.stuckAttempts = db.stuckAttempts || {};
            db.stuckAttempts[msg.id] = (db.stuckAttempts[msg.id] || 0) + 1;
            D.log(db, `${how} (stuck) → ${msg.id} (attempt ${db.stuckAttempts[msg.id]})`);
            C.showMessage('הצלחה: הפעולה בוצעה', ['ok']);
            resetPage();
            renderGrid();
            return;
          }
          msg.status = 'טופלה';
          msg.handledBy = how;
          msg.handledAt = new Date().toISOString();
          D.log(db, `${how} → ${msg.id}`);
          C.showMessage('הצלחה: הפעולה בוצעה', ['ok']);
          resetPage();
          renderGrid();
        } };
      }

      return { kind: 'none' };
    },
    onContinue() { D.log(db, 'user clicked המשך'); },
    afterPostback() { D.save(db); },
  };

  render();
})();
</script>
</body>
</html>
